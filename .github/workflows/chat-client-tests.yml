name: Chat client tests

on:
  push:
    branches: [dante-test]
    paths:
      - 'chat-client.mjs'
      - 'chat-client.test.mjs'
      - '.github/workflows/chat-client-tests.yml'
  pull_request:
    branches: [dante-test]
    paths:
      - 'chat-client.mjs'
      - 'chat-client.test.mjs'
      - '.github/workflows/chat-client-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check client syntax
        run: node --check chat-client.mjs
      - name: Run chat client tests
        run: node --test chat-client.test.mjs
