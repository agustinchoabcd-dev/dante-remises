name: Chat client tests

on:
  push:
    branches: [dante-test]
    paths:
      - 'chat-client.mjs'
      - 'chat-client.test.mjs'
      - 'index.html'
      - 'index.html'
      - '.github/workflows/chat-client-tests.yml'
  pull_request:
    branches: [dante-test]
    paths:
      - 'chat-client.mjs'
      - 'chat-client.test.mjs'
      - '.github/workflows/chat-client-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check client syntax
        run: node --check chat-client.mjs
      - name: Check inline app module syntax
        run: |
          node -e "const fs=require('node:fs');const html=fs.readFileSync('index.html','utf8');const match=html.match(/<script type=\"module\">([\\s\\S]*?)<\\/script>/);if(!match)throw new Error('Inline module not found');fs.writeFileSync('/tmp/dante-index-inline.mjs',match[1]);"
          node --check /tmp/dante-index-inline.mjs
      - name: Run chat client tests
        run: node --test chat-client.test.mjs
