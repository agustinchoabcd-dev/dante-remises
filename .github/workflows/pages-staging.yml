name: Deploy dante-test web to Cloudflare Pages staging

on:
  push:
    branches:
      - dante-test
      - mapbox-migration-prototype
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dante-remises-pages-staging
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Publish isolated web staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web build dependencies
        run: npm install --include=optional

      - name: Inject Mapbox public token for migration preview
        if: github.ref_name == 'mapbox-migration-prototype'
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const token = process.env.MAPBOX_PUBLIC_TOKEN || '';
          if (!token.startsWith('pk.') || token.length < 30) {
            throw new Error('Missing or invalid MAPBOX_PUBLIC_TOKEN. Add the public pk.* token as a repository Actions secret.');
          }
          writeFileSync('js/mapbox-config.js', 'window.DANTE_MAPBOX_TOKEN = ' + JSON.stringify(token) + ';\n', {encoding:'utf8'});
          console.log('Mapbox public token injected into staging build.');
          NODE

      - name: Prepare static site with all web assets
        run: |
          npm run copy:web
          mkdir -p site
          cp -R www/. site/

      - name: Create Pages project if needed
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create dante-remises-staging --production-branch dante-test

      - name: Deploy staging site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy site --project-name=dante-remises-staging --branch="${GITHUB_REF_NAME}" --commit-dirty=true
