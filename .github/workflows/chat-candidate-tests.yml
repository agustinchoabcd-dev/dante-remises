name: Chat candidate tests

on:
  push:
    branches: [dante-test]
    paths:
      - 'chat-worker/**'
      - '.github/workflows/chat-candidate-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check chat-worker/chat-module-candidate-dynamic.js
      - name: Run chat candidate tests
        run: node --test chat-worker/chat-module-candidate-dynamic.test.mjs
