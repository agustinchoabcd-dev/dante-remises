name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-capacitor
      - android-photo-test
      - fix/passenger-onboarding-trip-diagnostics
      - fix/passenger-onboarding-camera-flow
      - feature/driver-presence

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Validate inline application JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script type="module">\s*(.*?)\s*</script>', html, re.DOTALL)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one module script, found {len(scripts)}")
          Path("/tmp/dante-remises-inline.mjs").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/dante-remises-inline.mjs

      - name: Install JavaScript dependencies
        run: npm install

      - name: Copy web application into Capacitor assets
        run: npm run copy:web

      - name: Generate Android project
        run: npx cap add android

      - name: Declare Android location permissions
        run: node scripts/patch-android-manifest.mjs

      - name: Generate Android app icons from Dante Remises logo
        run: npm run assets:android

      - name: Synchronize Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dante-remises-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
